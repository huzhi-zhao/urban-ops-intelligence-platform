# Out-of-pipeline data-quality rules.
#
# Design: docs/dev/design/20260822-out-of-pipeline-dq-audit.md
# Parser:  scripts/dq/rules.py   Runner: scripts/dq/run_audit.py
#
# Every value here has a measured anchor — an L3-c baseline number, a launch
# doc's row count, or a contract. A rule whose expected value nobody measured
# is a rule that will be argued about instead of fixed, so it does not go in.
#
# 🔴 No row-count rule is an equality (design §4.2). Exact equality belongs to
# the in-pipeline gates, where the expected value and the observed value come
# from the same build. Out here the table gets rebuilt and the upstream
# appends, so an equality goes stale and the rule gets muted. Lower bounds are
# baseline × 0.9 rounded to a readable number: they catch "the table is empty"
# and "only the last chunk landed", while the pct_change rules catch drift.
#
# `table: "*"` means "once per Gold table" — the runner expands it.
version: 1

rules:

  # ── Structural ────────────────────────────────────────────────────────────
  # Re-run of the DDL's four test families. The assertions themselves stay
  # owned by L3-c (edit them in the DDL headers); this is the second consumer,
  # running them on a schedule instead of once at build time. Baseline:
  # 185 assertions / 0 violations.
  - id: GOLD-STRUCT-DDL-ASSERTIONS
    layer: gold
    table: "*"
    dimension: structural
    check:
      type: ddl_assertions
    comparator: "=="
    expected: 0
    severity: error
    cadence: daily
    note: "185 条四件套复跑；rows_failed = 0。可空列只在非空行上检查（继承 dq_assertions 语义）"

  # ── Statistical · row counts ──────────────────────────────────────────────
