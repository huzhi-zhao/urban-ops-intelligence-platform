# Gold contract for TBL-F2. The core supply-side quantity. Serves BO-2.

table: fact_event_zone_rank
layer: gold
grain: (plow_event_id, plow_zone)

primary_key: [plow_event_id, plow_zone]
row_count_expectation:
  exact: 418
  note: "19 events x 22 zones, zero missing."

columns:
  - name: plow_event_id
    type: string
    nullable: false
    note: "One of the 19 city-wide plow operations, distinct from event_id (the ~99 snowfall events)."

  - name: plow_zone
    type: string
    nullable: false
    references: dim_plow_zone.plow_zone
    cardinality: 22

  - name: shift_number
    type: int
    nullable: false
    domain: [1, 2, 3, 4, 5]

  - name: rank_factor
    type: double
    nullable: true
    range: [0.2, 1]
    note: >-
      Formula: shift_number / 5 (fixed denominator, not min-max over
      observed shift numbers — launch doc 20260813 A1). Range is [0.2, 1],
      never 0 — shift_number's domain floor of 1 makes 0 structurally
      unreachable, so the 'never 0' assertion holds by construction instead
      of by convention. NULL for any plow-event outside the 19 known ones or
      for dates before 2015-12 — a NULL here is the *only* correct missing
      representation (BO-6).

  - name: matched_snowfall_event_id
    type: string
    nullable: true
    references: dim_snowfall_event.event_id
    note: >-
      NULL for the two known-unaligned operations (2021-01-07, 2026-02-26) —
      expected, must be surfaced not hidden. Alignment rate must be >= 17/19
      (89.5%). Denormalized copy of dim_plow_event.matched_snowfall_event_id
      (launch doc 20260813 B1) — this table's own uniqueness test below is
      the fan-out guard; a consumer joining F6 in via this column must join
      through dim_plow_event, not this table directly, or verify the same
      uniqueness itself.

  - name: etl_run_id
    type: string
    nullable: false
  - name: built_at
    type: timestamp
    nullable: false
  - name: source_max_ingest_date
    type: date
    nullable: false

forbidden_columns: [region_type, ward, neighbourhood]

served_by_bo: [BO-2]

tests:
  unique: [[plow_event_id, plow_zone]]
  not_null: [plow_event_id, plow_zone, shift_number]
  accepted_values:
    shift_number: [1, 2, 3, 4, 5]
  relationships:
    - "COUNT(*) = 418"
    - "COUNT(*) WHERE rank_factor = 0 = 0"
    - "COUNT(DISTINCT plow_event_id WHERE matched_snowfall_event_id IS NOT NULL) >= 17"
    - "COUNT(DISTINCT matched_snowfall_event_id) = COUNT(DISTINCT plow_event_id) WHERE matched_snowfall_event_id IS NOT NULL  -- no two plow_events collapse into one snowfall_event; fan-out guard for B1"
