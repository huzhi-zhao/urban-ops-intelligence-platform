# Gold contract for TBL-F1. M1's training panel. Serves BO-1.

table: fact_service_request_zone_event
layer: gold
grain: (event_id, plow_zone, winter_category)

primary_key: [event_id, plow_zone, winter_category]
row_count_expectation:
  full_panel: true
  exact: 13068
  panel_cells: 2178
  scheduling_era_panel_cells: 1298
  category_count: 6
  note: >-
    ✅ Full panel, all 99 snowfall events — not just the 59 scheduling-era
    ones (launch doc 20260813 B2: F1 is M1's *only* training panel, and
    dim_snowfall_event.yaml commits pre-era events to feeding M1's
    long-horizon training; that commitment has nowhere to live if F1 stops
    at 59). 2178 = 22 zones x 99 events; 13068 = 2178 x 6 *effective*
    winter_category values (dim_winter_category.yaml, launch doc 20260813
    A3; PLOUGH excluded — a portability row with 0 real matches). The
    scoring chain (fact_winter_event_zone_load, F6) still reads only the
    1298-cell scheduling-era subset — F1 being larger than F6 is intended,
    not a grain mismatch. Do NOT filter to zero-request cells — M1 needs the
    zero as a training signal, not a gap to be backfilled downstream. The
    70.57% / 916-cell non-zero figure (design doc §6.1) is defined and
    asserted at the (event_id, plow_zone) grain **within the scheduling-era
    subset only**, summed across categories — see the relationships test
    below, not at this table's own row grain or its full 2178-cell extent.

columns:
  - name: event_id
    type: string
    nullable: false
    references: dim_snowfall_event.event_id

  - name: plow_zone
    type: string
    nullable: false
    references: dim_plow_zone.plow_zone
    note: "22 values only — has_plow_schedule = true. Not 25; see dim_plow_zone."

  - name: winter_category
    type: string
    nullable: false
    references: dim_winter_category.winter_category

  - name: request_count
    type: int
    nullable: false
    note: "Zero is a valid, meaningful value — not a placeholder for missing."

  - name: weighted_request_count
    type: double
    nullable: false
    note: "request_count weighted by dim_service_type.priority_weight."

  - name: etl_run_id
    type: string
    nullable: false
  - name: built_at
    type: timestamp
    nullable: false
  - name: source_max_ingest_date
    type: date
    nullable: false

forbidden_columns: [region_type, ward, neighbourhood]
forbidden_columns_note: "ADR 0010 D2 — administrative units never enter a scoring-chain fact table's key."

served_by_bo: [BO-1]

tests:
  unique: [[event_id, plow_zone, winter_category]]
  not_null: [event_id, plow_zone, winter_category, request_count, weighted_request_count]
  relationships:
    - "event_id -> dim_snowfall_event.event_id"
    - "plow_zone -> dim_plow_zone.plow_zone WHERE has_plow_schedule = true"
    - "winter_category -> dim_winter_category.winter_category WHERE is_effective = true"
    - "COUNT(*) = 13068"
    - "COUNT(DISTINCT (event_id, plow_zone)) = 2178"
    - "COUNT(DISTINCT (event_id, plow_zone)) WHERE event_id IN (SELECT event_id FROM dim_snowfall_event WHERE is_scheduling_era = true) = 1298"
    - "COUNT(*) FROM (SELECT event_id, plow_zone FROM fact_service_request_zone_event WHERE event_id IN (SELECT event_id FROM dim_snowfall_event WHERE is_scheduling_era = true) GROUP BY event_id, plow_zone HAVING SUM(request_count) > 0) = 916"
