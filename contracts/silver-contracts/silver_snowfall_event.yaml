# Silver contract for TBL-S6. ✅ Already built — matches
# spark/schemas/weather_schemas.py SNOWFALL_EVENT_SCHEMA, plus one field
# (event_rule_version) added per ADR 0010 §5 Q4 / design §8 O3.
#
# 🔴 event_rule_version is a schema addition on top of the currently deployed
# SNOWFALL_EVENT_SCHEMA — add it to the StructType before S4 (DDL) freezes.

table: silver_snowfall_event
layer: silver
source_id: SRC-Open-Meteo
dataset: weather_archive
grain: event

primary_key: [snowfall_event_id]
partition_by: null

columns:
  - name: snowfall_event_id
    type: string
    nullable: false

  - name: start_date
    type: date
    nullable: false

  - name: end_date
    type: date
    nullable: false

  - name: duration_days
    type: int
    nullable: false
    note: "Median 1.0 day even with the rolling-accumulation criterion — an 'event' is functionally a snow day, not a multi-day storm. Do not narrate as multi-day."

  - name: total_snowfall_cm
    type: double
    nullable: false

  - name: peak_daily_snowfall_cm
    type: double
    nullable: false

  - name: min_temperature_c
    type: double
    nullable: true

  - name: event_rule_version
    type: string
    nullable: false
    domain: [v1-3cm-or-10d10cm]
    note: >-
      Semantic versioning per ADR 0010 §5
      Q4: single-day >= 3cm OR 10-day rolling window >= 10cm. Add to the
      StructType before contract freeze (S3) — future threshold changes get a
      new domain value, never overwrite the meaning of an existing one.

  - name: accum_flag
    type: boolean
    nullable: false
    note: >-
      Launch doc 20260813 B5. True iff
      no single day in the event met the single-day threshold on its own
      (peak_daily_snowfall_cm < threshold) — the event exists only because
      the rolling 10-day accumulation criterion pulled it in. Sourced from
      scripts.analysis.snowfall_events.Event.accum_triggered, same
      derivation. This is the column that turns the "4 plow operations
      matched no snowfall event until subthreshold accumulation was found"
      finding (BO-3 ③) into a queryable fact instead of a probe-only result.

  - name: source_id
    type: string
    nullable: false

  - name: loaded_at
    type: timestamp
    nullable: false

row_count_expectation:
  exact_by_rule_version:
    v1-3cm-or-10d10cm: 159
  probe_scope_subset:
    v1-3cm-or-10d10cm: 99
  note: "Two scopes, both measured 2026-08-17. The table holds 159 events over the full Bronze history (2000-01-01 .. 2026-08-18, every calendar month) — that range is design 20260817-silver-etl-runnable O4's decision to start from Bronze's actual earliest day. The 99 previously recorded here is the *probe* scope, not the table's: scripts/analysis/snowfall_events.py starts at FIRST_WINTER=2008 and only reads Nov 1 → May 1 windows. Filtering the table to that scope (start_date >= 2008-11-01 AND MONTH(start_date) IN (11,12,1,2,3,4)) returns exactly 99, so the pipeline's event segmentation and the probe agree — the earlier 99 was a scope mismatch, not a defect. The remaining 60 = 52 events in 2000-2007 plus 8 starting outside Nov-Apr from 2008 on (17 such events across the whole history; the largest is 2019-10-10..10-20, 41.16 cm). 59 of the probe-scope 99 fall in the scheduling era (2015-12+) and are the ones with a defined plow-zone rank; the rest exist for M1's long-horizon demand training only."

freshness:
  incremental_dag: null
  rebuild_dag: dag_backfill_silver_weather_archive
  note: "An event spanning a daily-DAG window boundary would be cut in two — event rebuilds only happen via the backfill DAG, never the daily incremental one (.claude/rules/backfill.md)."

tests:
  unique: [[snowfall_event_id]]
  not_null: [snowfall_event_id, start_date, end_date, total_snowfall_cm, event_rule_version, accum_flag]
  accepted_values:
    event_rule_version: [v1-3cm-or-10d10cm]
  relationships:
    - "COUNT(*) WHERE event_rule_version = 'v1-3cm-or-10d10cm' = 159"
    - "COUNT(*) WHERE event_rule_version = 'v1-3cm-or-10d10cm' AND start_date >= DATE '2008-11-01' AND MONTH(start_date) IN (11,12,1,2,3,4) = 99  -- probe scope; reconciles with scripts/analysis/snowfall_events.py"
