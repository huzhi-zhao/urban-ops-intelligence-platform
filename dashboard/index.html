          <h1>Who gets plowed first?</h1>
          <p>Across the 19 city-wide residential plow operations with a published schedule, all 22 scheduled zones appear every time. Their average scheduled position still differs by about 26 hours between the two ends of the schedule.</p>
          <p>Only 2 of 25 plow zones place all their winter service requests in a single ward. Work zones and wards cannot stand in for each other.</p>
