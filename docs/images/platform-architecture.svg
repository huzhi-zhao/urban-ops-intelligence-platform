<svg width="100%" viewBox="0 0 760 1020" role="img" xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Urban Operations Intelligence Platform — end-to-end architecture</title>
<desc>A top-down pipeline diagram. Open-data APIs feed either Airflow DAGs on the compute node or a standalone snapshot collector on the storage node. Bronze, Silver and Gold live in MinIO on the storage node; Airflow, Spark, Hive Metastore and Trino run on a separate, stateless compute node and reach storage over s3a. Gold feeds a SQL rules engine that produces the operational load score, drivers, resource recommendations and an SLA audit, surfaced in Superset.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ══ SECTION: Data sources ══ -->
<text x="30" y="28" font-size="12" fill="#3D3D3A">Data sources — Winnipeg open data, declared in config/sources/*.yaml</text>
