<!-- ══ SECTION: Operational intelligence ══ -->
<line x1="198" y1="558" x2="198" y2="698" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="30" y="692" font-size="12" fill="#3D3D3A">Operational intelligence</text>
<line x1="212" y1="688" x2="730" y2="688" stroke="#D9D8D2" stroke-width="1"/>

<g>
  <rect x="30" y="698" width="700" height="72" rx="10" fill="#FBE7DF" stroke="#B4522F" stroke-width="0.8"/>
  <text x="380" y="721" text-anchor="middle" font-size="13" font-weight="600" fill="#8A3D22">Operational Load Score engine (0–100) — deterministic rules, no ML</text>
  <text x="380" y="741" text-anchor="middle" font-size="11" fill="#A44A2A">0.35 × weighted service requests + 0.30 × supply gap + 0.20 × weather severity + 0.15 × emergency incidents</text>
  <text x="380" y="758" text-anchor="middle" font-size="10.5" fill="#C0765A">Normalised per road-network km · weights and recommendation rules live in dimension tables, not in SQL</text>
</g>

