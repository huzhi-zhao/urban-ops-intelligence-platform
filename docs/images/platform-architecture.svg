<!-- ══ SECTION: Deployment topology ══ -->
<text x="30" y="134" font-size="12" fill="#3D3D3A">Deployment — storage / compute separation</text>

<!-- ── Compute node panel ── -->
<rect x="30" y="140" width="336" height="520" rx="12" fill="#FBFAF8" stroke="#A8A79E" stroke-width="1" stroke-dasharray="5 4"/>
<text x="44" y="163" font-size="13" font-weight="600" fill="#3D3D3A">Compute node</text>
<text x="44" y="180" font-size="11" fill="#6E6D66">Docker · 4 core / 24 GB ARM</text>
<text x="44" y="195" font-size="10.5" fill="#8A897F">Stateless · a rebuild loses no data</text>

<!-- Airflow -->
<g>
  <rect x="42" y="210" width="312" height="64" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="198" y="231" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3C3489">Apache Airflow (LocalExecutor)</text>
  <text x="198" y="249" text-anchor="middle" font-size="11" fill="#534AB7">Incremental · backfill · audit &amp; self-heal DAGs</text>
  <text x="198" y="265" text-anchor="middle" font-size="10.5" fill="#7C74C7">Scheduling only — no business logic</text>
</g>
<!-- Spark -->
<g>
  <rect x="42" y="366" width="312" height="64" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="198" y="387" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3C3489">Spark 3.5.1 Standalone</text>
  <text x="198" y="405" text-anchor="middle" font-size="11" fill="#534AB7">Bronze → Silver: schema, dedup, UTC, rejects</text>
  <text x="198" y="421" text-anchor="middle" font-size="10.5" fill="#7C74C7">client mode — driver in the scheduler container</text>
</g>
<!-- Hive Metastore + Trino -->
<g>
  <rect x="42" y="494" width="312" height="64" rx="9" fill="#FBE7DF" stroke="#B4522F" stroke-width="0.8"/>
  <text x="198" y="515" text-anchor="middle" font-size="12.5" font-weight="600" fill="#8A3D22">Hive Metastore (MySQL) + Trino</text>
  <text x="198" y="533" text-anchor="middle" font-size="11" fill="#A44A2A">Gold modelling · ST_Contains spatial join</text>
  <text x="198" y="549" text-anchor="middle" font-size="10.5" fill="#C0765A">SQL dialect: trino only</text>
</g>

<!-- ── Storage node panel ── -->
<rect x="436" y="140" width="294" height="520" rx="12" fill="#FBFAF8" stroke="#A8A79E" stroke-width="1" stroke-dasharray="5 4"/>
<text x="448" y="163" font-size="13" font-weight="600" fill="#3D3D3A">Storage node</text>
<text x="448" y="180" font-size="11" fill="#6E6D66">MinIO (S3) · 100 GB</text>
<text x="448" y="195" font-size="10.5" fill="#8A897F">Sole source of truth · no backup</text>

<!-- Snapshot collector -->
<g>
  <rect x="448" y="210" width="270" height="64" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="583" y="231" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3C3489">Snapshot collector (timer)</text>
  <text x="583" y="249" text-anchor="middle" font-size="11" fill="#534AB7">Streaming write · min-records guard</text>
  <text x="583" y="265" text-anchor="middle" font-size="10.5" fill="#7C74C7">Not an Airflow DAG — unreplayable</text>
</g>
<line x1="583" y1="274" x2="583" y2="310" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="591" y="296" font-size="9.5" fill="#6E6D66">ingest_date=</text>

<!-- Bronze -->
<g>
  <rect x="448" y="314" width="270" height="64" rx="9" fill="#F7E4CE" stroke="#A0632A" stroke-width="0.8"/>
  <text x="583" y="335" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6E4118">Bronze — immutable raw</text>
  <text x="583" y="353" text-anchor="middle" font-size="11" fill="#8A5423">.ndjson.gz + manifest.json</text>
  <text x="583" y="369" text-anchor="middle" font-size="10.5" fill="#A87B4E">daily · monthly · static · snapshot</text>
</g>
<!-- Silver -->
<g>
  <rect x="448" y="442" width="270" height="64" rx="9" fill="#E9EAEE" stroke="#5F6672" stroke-width="0.8"/>
  <text x="583" y="463" text-anchor="middle" font-size="12.5" font-weight="600" fill="#38404C">Silver — cleansed</text>
  <text x="583" y="481" text-anchor="middle" font-size="11" fill="#4E5663">Parquet, date-partitioned · UTC</text>
  <text x="583" y="497" text-anchor="middle" font-size="10.5" fill="#7B838F">rejected rows → silver/_rejects/</text>
</g>
<!-- Gold -->
<g>
  <rect x="448" y="566" width="270" height="64" rx="9" fill="#FAEEC5" stroke="#97781C" stroke-width="0.8"/>
  <text x="583" y="587" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6A5210">Gold — star schema</text>
  <text x="583" y="605" text-anchor="middle" font-size="11" fill="#856916">Hive Parquet → Iceberg later</text>
  <text x="583" y="621" text-anchor="middle" font-size="10.5" fill="#A38F42">fact_* by date, clustered by zone</text>
</g>

