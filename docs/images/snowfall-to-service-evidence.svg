<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="UOIP: four public datasets pass through written rules and quality checks into one clean table per snowfall and work area; a demand model then estimates requests with a range, graded against later seasons and shown beside the plow plan, never merged into one score">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0F6B63" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#0F6B63" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1B2A33" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0.5 L9 5 L0 9.5" fill="none" stroke="#0F6B63" stroke-opacity="0.75" stroke-width="1.4"/>
    </marker>
    <marker id="tipAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0.5 L9 5 L0 9.5" fill="none" stroke="#E3A11A" stroke-width="1.8"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="#FFFFFF"/>
  <rect width="1200" height="600" fill="url(#grid)"/>
  <ellipse cx="620" cy="290" rx="560" ry="200" fill="url(#glow)"/>

  <!-- wordmark -->
  <g font-family="'Franklin Gothic Demi',Arial,sans-serif">
    <text x="88" y="84" font-size="46" letter-spacing="0.5"><tspan fill="#56666F" font-family="'Franklin Gothic Book',Arial,sans-serif">From </tspan><tspan fill="#0F6B63">Snowfall</tspan><tspan fill="#56666F" font-family="'Franklin Gothic Book',Arial,sans-serif"> to </tspan><tspan fill="#1B2A33">Service Evidence</tspan></text>
    <path d="M92 108 H862" stroke="#0F6B63" stroke-opacity="0.25" stroke-width="3"/>
  </g>

  <!-- 1 · inputs: four public datasets (Bronze) -->
  <g font-family="'Franklin Gothic Book',Arial,sans-serif" font-size="20" fill="#1B2A33">
    <g>
      <rect x="94" y="173" width="13" height="13" rx="2.5" fill="#0F6B63"/>
      <text x="120" y="186">Resident reports</text>
      <path d="M286 180 C 318 180, 316 266, 344 266" fill="none" stroke="#0F6B63" stroke-opacity="0.35" stroke-width="2"/>
    </g>
    <g>
      <rect x="94" y="228" width="13" height="13" rx="2.5" fill="none" stroke="#0F6B63" stroke-opacity="0.8" stroke-width="2"/>
      <text x="120" y="241">Plow schedule</text>
      <path d="M262 235 C 300 235, 312 266, 344 266" fill="none" stroke="#0F6B63" stroke-opacity="0.35" stroke-width="2"/>
    </g>
    <g>
      <rect x="94" y="283" width="13" height="13" rx="2.5" fill="none" stroke="#7FB3AC" stroke-width="2"/>
      <text x="120" y="296">Daily weather</text>
      <path d="M254 290 C 300 290, 312 266, 344 266" fill="none" stroke="#0F6B63" stroke-opacity="0.35" stroke-width="2"/>
    </g>
    <g>
      <rect x="94" y="338" width="13" height="13" rx="2.5" fill="#7FB3AC" fill-opacity="0.45" stroke="#7FB3AC" stroke-width="1.5"/>
      <text x="120" y="351">Work-area map</text>
      <path d="M262 345 C 306 345, 314 266, 344 266" fill="none" stroke="#0F6B63" stroke-opacity="0.35" stroke-width="2"/>
    </g>
    <circle cx="350" cy="266" r="6" fill="#0F6B63"/>
    <path d="M356 266 H392" stroke="#0F6B63" stroke-opacity="0.6" stroke-width="2" marker-end="url(#tip)" fill="none"/>
  </g>

  <!-- 2 · processing: written rules + checks (Silver) -->
  <g font-family="'Franklin Gothic Book',Arial,sans-serif">
    <rect x="398" y="160" width="304" height="212" rx="8" fill="#0F6B63" fill-opacity="0.04" stroke="#0F6B63" stroke-opacity="0.35" stroke-width="1.6" stroke-dasharray="6 6"/>
    <g font-size="16" fill="#1B2A33">
      <rect x="414" y="176" width="272" height="42" rx="21" fill="#FFFFFF" stroke="#0F6B63" stroke-opacity="0.5" stroke-width="1.3"/>
      <text x="432" y="203"><tspan font-family="'Franklin Gothic Demi',Arial,sans-serif" fill="#0F6B63">TIME</tspan>   a plan is not a finish time</text>
      <rect x="414" y="228" width="272" height="42" rx="21" fill="#FFFFFF" stroke="#0F6B63" stroke-opacity="0.5" stroke-width="1.3"/>
      <text x="432" y="255"><tspan font-family="'Franklin Gothic Demi',Arial,sans-serif" fill="#0F6B63">PLACE</tspan>   located reports to areas</text>
      <rect x="414" y="280" width="272" height="42" rx="21" fill="#FFFFFF" stroke="#0F6B63" stroke-opacity="0.5" stroke-width="1.3"/>
      <text x="432" y="307"><tspan font-family="'Franklin Gothic Demi',Arial,sans-serif" fill="#0F6B63">EVENT</tspan>   daily weather into snowfalls</text>
    </g>
    <text x="550" y="354" text-anchor="middle" font-size="16" fill="#0F6B63">✓ quality checks run beside the data</text>
    <path d="M704 266 H744" stroke="#0F6B63" stroke-opacity="0.6" stroke-width="2" marker-end="url(#tip)" fill="none"/>
  </g>

  <!-- 3 · the clean table (Gold) -->
  <g font-family="'Franklin Gothic Book',Arial,sans-serif">
    <rect x="752" y="176" width="300" height="150" rx="8" fill="#FFFFFF" stroke="#0F6B63" stroke-opacity="0.55" stroke-width="1.6"/>
    <rect x="752" y="176" width="300" height="30" rx="8" fill="#0F6B63"/>
    <rect x="752" y="194" width="300" height="12" fill="#0F6B63"/>
    <text x="768" y="197" font-size="15" fill="#FFFFFF" font-family="'Franklin Gothic Demi',Arial,sans-serif" letter-spacing="0.6">snowfall × work area</text>
    <g fill="#0F6B63">
      <rect x="768" y="220" width="64" height="10" rx="2" fill-opacity="0.55"/><rect x="842" y="220" width="48" height="10" rx="2" fill-opacity="0.25"/><rect x="900" y="220" width="60" height="10" rx="2" fill-opacity="0.25"/><rect x="970" y="220" width="66" height="10" rx="2" fill-opacity="0.25"/>
      <rect x="768" y="242" width="64" height="10" rx="2" fill-opacity="0.55"/><rect x="842" y="242" width="48" height="10" rx="2" fill-opacity="0.25"/><rect x="900" y="242" width="60" height="10" rx="2" fill-opacity="0.25"/><rect x="970" y="242" width="66" height="10" rx="2" fill-opacity="0.25"/>
      <rect x="768" y="264" width="64" height="10" rx="2" fill-opacity="0.55"/><rect x="842" y="264" width="48" height="10" rx="2" fill-opacity="0.25"/><rect x="900" y="264" width="60" height="10" rx="2" fill-opacity="0.25"/><rect x="970" y="264" width="66" height="10" rx="2" fill-opacity="0.25"/>
      <rect x="768" y="286" width="64" height="10" rx="2" fill-opacity="0.55"/><rect x="842" y="286" width="48" height="10" rx="2" fill-opacity="0.25"/><rect x="900" y="286" width="60" height="10" rx="2" fill-opacity="0.25"/><rect x="970" y="286" width="66" height="10" rx="2" fill-opacity="0.25"/>
      <rect x="768" y="308" width="64" height="6" rx="2" fill-opacity="0.2"/><rect x="842" y="308" width="48" height="6" rx="2" fill-opacity="0.12"/><rect x="900" y="308" width="60" height="6" rx="2" fill-opacity="0.12"/><rect x="970" y="308" width="66" height="6" rx="2" fill-opacity="0.12"/>
    </g>
    <text x="752" y="354" font-size="20" fill="#1B2A33" font-family="'Franklin Gothic Demi',Arial,sans-serif">2,178 rows · 0 missing</text>
    <text x="752" y="378" font-size="16" fill="#56666F">clean, traceable, ready for the model</text>
  </g>

  <!-- lakehouse layers -->
  <g font-family="'Franklin Gothic Book',Arial,sans-serif" font-size="17" letter-spacing="1.4" fill="#8C99A1">
    <path d="M92 400 H356" stroke="#1B2A33" stroke-opacity="0.12" stroke-width="2"/>
    <text x="92" y="424">Bronze</text>
    <path d="M398 400 H702" stroke="#1B2A33" stroke-opacity="0.12" stroke-width="2"/>
    <text x="398" y="424">Silver</text>
    <path d="M752 400 H1108" stroke="#0F6B63" stroke-opacity="0.4" stroke-width="2"/>
    <text x="752" y="424" fill="#0F6B63">Gold</text>
  </g>

  <!-- 4 · what the model turns the table into (H2) -->
  <g font-family="'Franklin Gothic Book',Arial,sans-serif">
    <path d="M902 386 C 902 440, 902 450, 902 474" stroke="#E3A11A" stroke-width="2.2" marker-end="url(#tipAmber)" fill="none"/>
    <text x="914" y="452" font-size="16" fill="#8A5A00" font-family="'Franklin Gothic Demi',Arial,sans-serif">demand model</text>
    <rect x="92" y="480" width="1016" height="92" rx="14" fill="#FBEFD3" stroke="#E3A11A" stroke-width="1.6"/>
    <text x="118" y="518" font-size="18" fill="#8A5A00" font-family="'Franklin Gothic Demi',Arial,sans-serif" letter-spacing="0.8">WHAT THE</text>
    <text x="118" y="542" font-size="18" fill="#8A5A00" font-family="'Franklin Gothic Demi',Arial,sans-serif" letter-spacing="0.8">MODEL ADDS</text>
    <path d="M262 496 V556" stroke="#E3A11A" stroke-opacity="0.6" stroke-width="1.5"/>
    <g font-size="19" fill="#1B2A33">
      <circle cx="294" cy="524" r="15" fill="#E3A11A"/>
      <text x="294" y="530" text-anchor="middle" font-size="16" fill="#FFFFFF" font-family="'Franklin Gothic Demi',Arial,sans-serif">1</text>
      <text x="318" y="518" font-family="'Franklin Gothic Demi',Arial,sans-serif">Expected requests</text>
      <text x="318" y="544" font-size="16" fill="#56666F">per snowfall and area, with a range</text>
      <circle cx="584" cy="524" r="15" fill="#E3A11A"/>
      <text x="584" y="530" text-anchor="middle" font-size="16" fill="#FFFFFF" font-family="'Franklin Gothic Demi',Arial,sans-serif">2</text>
      <text x="608" y="518" font-family="'Franklin Gothic Demi',Arial,sans-serif">Graded on unseen seasons</text>
      <text x="608" y="544" font-size="16" fill="#56666F">against the requests that arrived</text>
      <circle cx="874" cy="524" r="15" fill="#E3A11A"/>
      <text x="874" y="530" text-anchor="middle" font-size="16" fill="#FFFFFF" font-family="'Franklin Gothic Demi',Arial,sans-serif">3</text>
      <text x="898" y="518" font-family="'Franklin Gothic Demi',Arial,sans-serif">Next to the plan</text>
      <text x="898" y="544" font-size="16" fill="#56666F">never merged into one score</text>
    </g>
  </g>
</svg>
