# Compute-node stack — Airflow schedules the backfill/ingest DAGs and submits
# Silver Spark jobs to the standalone Spark cluster (spark-master:7077). All
# object storage is MinIO on the separate storage node, reached over S3
# (ADR 0006): this node holds no state and is rebuildable.
#
# 边界：**spark-master 不在这里**。它属于共享大数据平台，由
# /opt/pace_ai_lab/docker/spark/docker-compose.yml 提供，本栈只贡献自己的
# worker（spark-worker-uoip）并通过外部网络 bigdata-net 连上去。
#
# 为什么这么切：worker 要执行本项目的 Python UDF，它的 Python 版本和第三方
# 依赖由本项目的 driver 决定（见 Dockerfile.spark-worker），是项目属性；
# master 只做调度协调、不跑用户代码，是平台属性。历史上两边的 compose 都定义
# 了 spark-master/spark-worker，在 bigdata-net 上容器名互撞。
#
# 启动前提：平台侧的 spark-master 已经在跑。
#   docker compose -f /opt/pace_ai_lab/docker/spark/docker-compose.yml up -d
#
# compose project name 固定为 uoip（下面的 `name:`），不再随目录名叫 "docker"。
name: uoip

# Anchored separately from x-airflow-common so a service can *extend* the env
# map (airflow-init adds the admin password) instead of replacing it — a bare
# `environment:` key on a service overrides the merged one wholesale, which
# would silently strip SQL_ALCHEMY_CONN from `airflow db migrate`.
x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  # Every secret below comes from .env and is REQUIRED (${VAR:?} aborts the
  # compose run when unset). No default, deliberately: a default here is a
  # credential in a tracked file, and a weak default that "works" is worse
  # than a startup failure that names the missing variable.
  # Hostname must be the service-specific `uoip-postgres`, not the generic
  # `postgres` — bigdata-net is shared with the platform stack, which runs
  # its own container also aliased `postgres` (same collision pattern as the
  # spark-master note above). Compose auto-registers every service name as a
  # network alias with no way to opt out short of renaming the service, so a
  # generic name here silently round-robins between two different databases
  # with two different passwords. Traced 2026-08-17 via intermittent
  # `password authentication failed for user "airflow"` on this stack's own
  # Airflow CLI commands — see docs/dev/adr/ naming convention note.
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
    postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@uoip-postgres/airflow
  AIRFLOW__CORE__FERNET_KEY: ''
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?set AIRFLOW_WEBSERVER_SECRET_KEY in .env}
  AIRFLOW__CORE__AUTH_MANAGER: 'airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager'
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-webserver:8080/execution/'
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env}
  AIRFLOW__API_AUTH__JWT_ISSUER: 'airflow'
  # Airflow 在 nginx https 反代后面必须知道自己的外部地址，否则静态资源和
  # 登录后的重定向会指向 http://localhost:28080。Airflow 3 的键名是
  # AIRFLOW__API__BASE_URL（2.x 时代叫 AIRFLOW__WEBSERVER__BASE_URL）。
  AIRFLOW__API__BASE_URL: ${AIRFLOW_BASE_URL:-https://airflow.huzhi.dev}
  PYTHONPATH: /opt/airflow/plugins
  # The Spark driver runs *inside this container* (deploy-mode=client below), and
  # it hits s3a before any executor does — DataSource.checkAndGlobPathIfNecessary
  # calls exists() on every input path. So the driver needs the same credentials
  # the worker has. s3a's default provider chain only reads the AWS_* names;
  # .env carries them as S3_*, hence the rename here. Same reasoning as
  # spark-worker: environment injection, never a --conf flag.
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
  # Spark connection consumed by SparkSubmitOperator(conn_id="spark_default").
  # spark-master must already be reachable by container name on bigdata-net.
  AIRFLOW_CONN_SPARK_DEFAULT: 'spark://spark-master:7077?deploy-mode=client'

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  env_file:
    - ../../.env
  networks:
    - bigdata-net
  environment:
    <<: *airflow-env
  volumes:
    - ../../dags:/opt/airflow/dags
    - ../../ingestion:/opt/airflow/plugins/ingestion
    - ../../scripts:/opt/airflow/plugins/scripts
    - ../../config:/opt/airflow/plugins/config
    - ../../spark:/opt/airflow/plugins/spark
    - ../../data:/opt/airflow/data:ro
    - airflow-logs:/opt/airflow/logs
  depends_on:
    uoip-postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  # Service name is `uoip-postgres`, not the generic `postgres` — see the
  # naming-collision note on AIRFLOW__DATABASE__SQL_ALCHEMY_CONN above.
  uoip-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    networks:
      - bigdata-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    # The admin password is read from the environment inside the container
    # rather than interpolated into the command string: anything on the command
    # line shows up in `docker inspect`, `ps` and the container's own event log.
    # `airflow users create` is idempotent-ish (it errors if the user exists),
    # so `|| true` keeps a re-run of airflow-init from failing the whole stack.
    environment:
      <<: *airflow-env
      _AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}
    # Exec form on purpose: the shell form's folded scalar would fold the
    # continuation into a literal newline mid-command. `$$` escapes the `$` so
    # Compose leaves it for bash instead of interpolating it away at parse time.
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        airflow users create --username admin --password "$$_AIRFLOW_ADMIN_PASSWORD"
        --firstname UOIP --lastname Admin --role Admin --email admin@uoip.local
        || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: airflow api-server
    ports:
      - "28080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--limit", "1"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-dag-processor:
    <<: *airflow-common
    command: airflow dag-processor

  # spark-master 见文件头：由平台侧提供，不在本栈内定义。
  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark-worker
    # 显式命名，给未来接入 bigdata-net 的其他项目 worker 留位。
    container_name: spark-worker-uoip
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      # 必须和平台侧 spark-master 的 reverseProxy 设置一致 —— worker 也要知道
      # 自己是通过 master 的 proxy 路径对外服务的，而不是自己的 host:port。
      # 不需要映射端口：worker UI 只在 bigdata-net 内部经 master 转发访问。
      # 平台侧对应配置: /opt/pace_ai_lab/docker/spark/docker-compose.yml
      SPARK_WORKER_OPTS: -Dspark.ui.reverseProxy=true
      # Executors read and write MinIO themselves, so they need credentials too.
      # Injected as environment variables for the s3a connector's default
      # credential provider chain — NOT via --conf, which would print them in
      # the Spark UI's Environment page, the process list and the task log.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    env_file:
      - ../../.env
    volumes:
      # Module-reference UDFs (e.g. spark/transforms/dcp.py's geojson_to_wkt_udf)
      # get cloudpickled by qualified name ("spark.transforms.dcp.<func>"), not
      # by value — the Executor's Python worker subprocess has to `import spark`
      # to resolve them at deserialize time. Mount at the same path Airflow uses
      # (/opt/airflow/plugins/spark) so the qualified name resolves identically
      # on both sides; paired with spark.executorEnv.PYTHONPATH in
      # dags/_spark_common.py.
      - ../../spark:/opt/airflow/plugins/spark:ro
    networks:
      - bigdata-net
    restart: unless-stopped

# 卷名写死，不带 compose project 前缀 —— 否则以后再改 project name 会把
# Airflow 元数据库（connections / variables / DAG run 历史）变成孤儿卷。
# 从旧的 docker_* 前缀迁移的命令见 infra/docker/README.md。
volumes:
  postgres-db:
    name: uoip_postgres_db
  airflow-logs:
    name: uoip_airflow_logs

networks:
  bigdata-net:
    external: true
