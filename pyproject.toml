[project]
name = "uoip"
version = "0.1.0"
description = "Urban Operations Intelligence Platform"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "pydantic>=2.13.4",
    "pyspark==3.5.1",  # must match the Spark cluster version (spark-master/spark-worker, infra/docker/docker-compose.yml)
    "shapely>=2.0.0",
    # Query-engine client, used by scripts/ddl/ to apply sql/ddl/*.sql. Trino
    # itself is shared platform infrastructure this repo does not start
    # (ADR 0006 §9) — only the client belongs here.
    "trino>=0.330.0",
]

[project.optional-dependencies]
# Single source of truth for dev deps. Do NOT re-add a [dependency-groups] dev
# table: having both meant `uv` had to satisfy two different pytest lower bounds,
# and it carried a phantom "apache-airflow-stubs" (no such package on PyPI) that
# made every `uv sync` / `uv run` fail at resolution.
# For Airflow type hints, install `apache-airflow` itself — it ships inline types.
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "sqlfluff>=3.0.0",
]

# Deliberately NOT in `dev`: apache-airflow is a heavy install and nothing in
# the day-to-day loop needs it, so `make test-unit` stays fast and the DAG
# tests skip locally. CI installs this extra and runs them for real — see the
# `dags` job in .github/workflows/ci.yml and O15 in the L2 launch doc.
#
# Pinned to the deployed image (infra/docker/Dockerfile.airflow). A CI that
# tests a different Airflow major than production tests the wrong thing: the
# four defects in stage E2 were all Airflow-3-specific, and two of them would
# have passed under Airflow 2.
airflow = [
    "apache-airflow==3.2.2",
    "apache-airflow-providers-standard",
    # Pinned again here: the Spark provider's own floor pulls pyspark 4.x, which
    # silently replaces the 3.5.1 the cluster runs — and the Spark unit tests
    # then fail in a way that looks nothing like "you installed an extra".
    "apache-airflow-providers-apache-spark",
    "pyspark==3.5.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501", "N812"]  # N812: `import pyspark.sql.functions as F` is the standard Spark idiom

[tool.ruff.lint.per-file-ignores]
# Integration tests must call load_dotenv() and extend sys.path *before* importing
# project packages, so module-level imports legitimately aren't all at the top.
"tests/integration/*" = ["E402"]
# `from airflow import DAG as AirflowDAG` — aliased so the isinstance() check can't
# be confused with the DAG name the DAG files themselves bind.
"tests/unit/test_dag_imports.py" = ["N811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "network: hits a live upstream API — excluded by `-m 'not network'` for offline runs",
    "slow: uploads a multi-MB object (measured ~11 MB / ~1s of CPU, plus network) — runs by default, exclude with `-m 'not slow'`",
]

[build-system]
requires = ["hatchling>=1.27"]  # >=1.27 understands PEP 639 `license` / `license-files`
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "scripts", "spark"]
